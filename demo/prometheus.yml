# Prometheus config used by BOTH compose files in this folder.
#
# Scrapes:
#   1. The sentinel-backend (whether it runs in the docker-compose.local-app.yml
#      stack OR on the host machine via `mvn spring-boot:run`)
#   2. A sample / user Spring Boot app running on the host
#
# If your app runs on a different host port, edit the `local-app` target.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # SENTINEL backend — try both the in-network container name AND the host port
  # so a single config works for both "all in docker" and "backend in IDE" flows.
  - job_name: 'sentinel-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['sentinel-backend:8080']
        labels:
          service: sentinel-backend
          source: docker
      - targets: ['host.docker.internal:8080']
        labels:
          service: sentinel-backend
          source: host

  # === Your local Spring Boot app ===
  # Runs on the HOST machine. Pick a port that doesn't clash with sentinel-backend
  # (which uses 8080 by default). The bundled demo/sample-app defaults to 1881;
  # override SERVER_PORT and update this target if you change it.
  - job_name: 'local-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:1881']
        labels:
          # IMPORTANT: SENTINEL's correlation rules key off the `service` label.
          # Keep this identical to the value in your app's
          # `management.metrics.tags.service` and OTel `service.name`.
          service: my-spring-boot-app
          app: my-spring-boot-app

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # === SENTINEL sample-producer (Python, demo/sample-producer/) ===
  # Stdlib producer that emits logs + traces + metrics directly. Defaults to
  # :1882. Marked honor_labels so the producer's own service= label survives.
  - job_name: 'sample-producer'
    metrics_path: '/metrics'
    honor_labels: true
    static_configs:
      - targets: ['host.docker.internal:1882']
        labels:
          service: sample-producer
          app: sample-producer
