# SENTINEL — monitor a Spring Boot app that runs on the HOST machine.
#
# What this brings up:
#   - Observability sinks: Elasticsearch + Kibana, Jaeger (OTLP enabled),
#     Prometheus, Grafana (with Prometheus auto-provisioned as datasource 1)
#   - Log shipper: Filebeat — tails files in ./logs and ships JSON-encoded
#     entries to Elasticsearch
#   - SENTINEL infra: Postgres, Redis, Kafka (+ Zookeeper)
#   - SENTINEL backend + frontend
#
# What runs on your HOST (not in this compose):
#   - Your Spring Boot app. Configure it per ./spring-boot-app-setup.md.
#   - It writes JSON logs into ./logs (Filebeat picks them up)
#   - It exposes /actuator/prometheus on a host port (Prometheus scrapes)
#   - It exports OTLP traces to localhost:4318 (Jaeger ingests)
#
# Networking gotchas:
#   - On Linux, host.docker.internal needs explicit aliasing. We add it via
#     extra_hosts on every container that needs it.
#   - Ports exposed on the host: 3000 (frontend), 8080 (backend),
#     5601 (kibana), 9090 (prometheus), 3001 (grafana), 16686 (jaeger UI),
#     4318 (jaeger OTLP/HTTP), 4317 (jaeger OTLP/gRPC).
#
# Run:
#   mkdir -p logs
#   docker compose -f demo/docker-compose.local-app.yml up -d --build
#
# Tear down:
#   docker compose -f demo/docker-compose.local-app.yml down -v

version: '3.9'

networks:
  sentinel-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  elasticsearch_data:
  grafana_data:
  prometheus_data:

x-host-extra: &host-extra
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  # ──────────────────────────────────────────────────────────────────────
  # SENTINEL infrastructure
  # ──────────────────────────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [sentinel-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    networks: [sentinel-net]
    command: redis-server --appendonly yes

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: sentinel-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [sentinel-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: sentinel-kafka
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes: [kafka_data:/var/lib/kafka/data]
    networks: [sentinel-net]

  # ──────────────────────────────────────────────────────────────────────
  # Logs — Elasticsearch + Kibana + Filebeat
  # ──────────────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: sentinel-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [elasticsearch_data:/usr/share/elasticsearch/data]
    networks: [sentinel-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: sentinel-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    networks: [sentinel-net]

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: sentinel-filebeat
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../logs:/host-logs:ro
    networks: [sentinel-net]

  # ──────────────────────────────────────────────────────────────────────
  # Traces — Jaeger with OTLP enabled
  # ──────────────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: sentinel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "16686:16686"   # Jaeger UI / Query API
      - "14268:14268"   # Jaeger HTTP collector
      - "4317:4317"     # OTLP gRPC — point your app's OTel exporter here
      - "4318:4318"     # OTLP HTTP — point your app's OTel exporter here
    networks: [sentinel-net]

  # ──────────────────────────────────────────────────────────────────────
  # Metrics — Prometheus + Grafana
  # ──────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: sentinel-prometheus
    <<: *host-extra
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks: [sentinel-net]

  grafana:
    image: grafana/grafana:10.3.1
    container_name: sentinel-grafana
    depends_on: [prometheus]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: sentinel
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [sentinel-net]

  # ──────────────────────────────────────────────────────────────────────
  # SENTINEL backend + frontend
  # ──────────────────────────────────────────────────────────────────────
  sentinel-backend:
    build:
      context: ../sentinel-backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    <<: *host-extra
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
      kafka:    { condition: service_started }
      elasticsearch: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinel
      DATABASE_USER: sentinel
      DATABASE_PASSWORD: sentinel
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      ES_URL: http://elasticsearch:9200
      JAEGER_URL: http://jaeger:16686
      GRAFANA_URL: http://grafana:3000
      GRAFANA_API_KEY: ""
      KIBANA_URL: http://kibana:5601
      REMEDIATION_DRY_RUN: "true"

      # === AI Copilot (FR-1 / FR-8) ===
      AGENT_ENABLED: "${AGENT_ENABLED:-false}"
      AGENT_MODE: "${AGENT_MODE:-advisory}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"

      # === Runtime/APM source — point at your HOST Spring Boot app ===
      # Override APM_HOST_PORT if your app runs on a different port (default 8080).
      APM_URL: "http://host.docker.internal:${APM_HOST_PORT:-8080}"
    networks: [sentinel-net]
    restart: unless-stopped

  sentinel-frontend:
    build:
      context: ../sentinel-frontend
    container_name: sentinel-frontend
    depends_on: [sentinel-backend]
    ports: ["3000:80"]
    environment:
      VITE_API_URL: http://localhost:8080
    networks: [sentinel-net]
