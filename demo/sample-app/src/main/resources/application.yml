# Sample app runs on the HOST machine alongside the SENTINEL backend.
# Port 1881 because :8080 is owned by the SENTINEL backend and :8081 is a
# common port that often clashes with other dev stacks.
server:
  port: ${SERVER_PORT:1881}

spring:
  application:
    # Must match the `service` label in demo/prometheus.yml AND the
    # OTel resource attribute below — SENTINEL's correlation engine
    # keys all signals by service name.
    name: my-spring-boot-app

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: my-spring-boot-app
  tracing:
    # 100% sampling for the demo — turn this down in real workloads.
    sampling:
      probability: 1.0
  # Spring Boot 3.2 / Micrometer Tracing reads OTLP config from
  # management.otlp.tracing.* (NOT otel.exporter.otlp.* — that's the
  # OpenTelemetry SDK's own auto-config, which we're not using).
  # Trailing /v1/traces is required by the OTLP/HTTP spec.
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  level:
    root: INFO
    com.example.sampleapp: INFO
