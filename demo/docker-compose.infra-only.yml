# INFRASTRUCTURE ONLY — no SENTINEL backend or frontend.
#
# Use this when you want to run sentinel-backend (`mvn spring-boot:run`) and
# sentinel-frontend (`npm run dev`) from your IDE / terminal so you can set
# breakpoints, hot-reload, and step through code.
#
# Brings up:
#   - Postgres, Redis, Kafka (Zookeeper) ── SENTINEL dependencies
#   - Elasticsearch + Kibana             ── log sink
#   - Jaeger (OTLP-enabled)              ── trace sink
#   - Prometheus + Grafana               ── metrics sink
#   - Filebeat                           ── ships ./logs/*.json into Elasticsearch
#
# Your local Spring Boot app (sample or real) runs ON THE HOST and writes:
#   - JSON logs   → ./logs/*.json   (Filebeat picks them up)
#   - traces      → http://localhost:4318  (OTLP HTTP)
#   - metrics     → /actuator/prometheus on its port (Prometheus scrapes)
#
# Run from the repo root:
#   mkdir -p logs
#   docker compose -f demo/docker-compose.infra-only.yml up -d
#
# Stop:
#   docker compose -f demo/docker-compose.infra-only.yml down
#
# Ports on localhost:
#   5432  Postgres        6379  Redis           9092  Kafka
#   9200  Elasticsearch   5601  Kibana
#   16686 Jaeger UI       4317  Jaeger OTLP gRPC  4318  Jaeger OTLP HTTP
#   9090  Prometheus      3001  Grafana (admin/sentinel)

version: '3.9'

networks:
  sentinel-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  elasticsearch_data:
  grafana_data:
  prometheus_data:

services:

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [sentinel-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    networks: [sentinel-net]
    command: redis-server --appendonly yes

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: sentinel-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [sentinel-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: sentinel-kafka
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes: [kafka_data:/var/lib/kafka/data]
    networks: [sentinel-net]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: sentinel-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [elasticsearch_data:/usr/share/elasticsearch/data]
    networks: [sentinel-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: sentinel-kibana
    depends_on:
      elasticsearch: { condition: service_healthy }
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    networks: [sentinel-net]

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: sentinel-filebeat
    user: root
    depends_on:
      elasticsearch: { condition: service_healthy }
    command: ["--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../logs:/host-logs:ro
    networks: [sentinel-net]

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: sentinel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "16686:16686"   # UI / Query API
      - "14268:14268"   # Jaeger HTTP collector
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks: [sentinel-net]

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: sentinel-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks: [sentinel-net]

  grafana:
    image: grafana/grafana:10.3.1
    container_name: sentinel-grafana
    depends_on: [prometheus]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: sentinel
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [sentinel-net]
