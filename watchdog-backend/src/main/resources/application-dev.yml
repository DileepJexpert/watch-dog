# IntelliJ "Run with profile = dev" — IDE-driven local debugging
#
# How to use:
#   IntelliJ Run/Debug Configuration → "Active profiles" field: dev
#   OR command line: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   OR env var: SPRING_PROFILES_ACTIVE=dev
#
# Verbose com.watchdog logging — every agent step, every tool call, every
# LLM HTTP round-trip, every WebSocket subscription gets logged. Noisy by
# design — that's the point of a debug profile.

logging:
  level:
    com.watchdog: DEBUG
    com.watchdog.agent: DEBUG
    com.watchdog.aihub: DEBUG
    com.watchdog.api.AgentController: DEBUG
    com.watchdog.knowledge: DEBUG
    com.watchdog.correlation: DEBUG
    com.watchdog.ingestion: DEBUG
    # Webflux WebClient body logging (only at TRACE — careful, contains LLM payloads)
    reactor.netty.http.client: INFO
    org.springframework.web.reactive.function.client.ExchangeFunctions: INFO
    org.springframework.web.socket: DEBUG
    # Stay quieter on framework noise even in dev
    org.springframework.kafka: WARN
    io.fabric8: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# Keep the agent advisory in dev (no actions executed) — but you can flip
# any of these in your run configuration without editing the file.
watchdog:
  agent:
    enabled: true
    mode: advisory
