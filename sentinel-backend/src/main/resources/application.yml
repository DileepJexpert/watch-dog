spring:
  application:
    name: sentinel
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${DATABASE_USER:sentinel}
    password: ${DATABASE_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Don't reject startup over a checksum mismatch — we occasionally patch
    # already-applied migrations to make them tolerant of environment differences
    # (e.g. TimescaleDB hypertable conversion in V1). New migrations still apply
    # cleanly; only checksum verification of historic applied scripts is relaxed.
    validate-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: sentinel-correlation
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.sentinel.model
        spring.json.value.default.type: com.sentinel.model.NormalizedEvent
      auto-offset-reset: latest
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sentinel: INFO
    org.springframework.kafka: WARN
    io.fabric8: WARN

# SENTINEL platform configuration
sentinel:
  elasticsearch:
    url: ${ES_URL:http://localhost:9200}
    index-pattern: "logs-*"
    poll-interval-seconds: 30
    username: ${ES_USER:}
    password: ${ES_PASSWORD:}

  jaeger:
    url: ${JAEGER_URL:http://localhost:16686}
    slow-trace-threshold-ms: 2000
    poll-interval-seconds: 60

  grafana:
    url: ${GRAFANA_URL:http://localhost:3000}
    api-key: ${GRAFANA_API_KEY:}
    poll-interval-seconds: 15

  health-probe:
    interval-seconds: 10
    timeout-seconds: 5
    targets:
      # Add monitored services here
      # - name: payment-service
      #   url: http://payment-service/actuator/health
      #   type: HTTP

  correlation:
    window-minutes: 5
    min-signals-for-correlation: 2

  alerting:
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      channel: "#sentinel-alerts"
    pagerduty:
      integration-key: ${PAGERDUTY_KEY:}
      events-url: https://events.pagerduty.com/v2/enqueue
    opsgenie:
      api-key: ${OPSGENIE_KEY:}
      alerts-url: https://api.opsgenie.com/v2/alerts
    teams:
      # Default Teams channel for all services without a specific mapping
      default-webhook-url: ${TEAMS_WEBHOOK_URL:}
      # Per-service webhook routing — map service name to its team's channel URL
      # Uncomment and set env vars for each service's team channel:
      # channel-map:
      #   payment-service: ${TEAMS_WEBHOOK_PAYMENT:}
      #   auth-service: ${TEAMS_WEBHOOK_AUTH:}
      #   order-service: ${TEAMS_WEBHOOK_ORDERS:}
      kibana-base-url: ${KIBANA_URL:http://localhost:5601}
      grafana-base-url: ${GRAFANA_URL:http://localhost:3000}
      jaeger-base-url: ${JAEGER_URL:http://localhost:16686}

  remediation:
    dry-run: ${REMEDIATION_DRY_RUN:true}
    max-scale-factor: 2.0
    restart-cooldown-minutes: 20
    max-restarts-per-hour: 3
    circuit-breaker-retry-minutes: 5
    max-circuit-breaker-cycles: 3

  anomaly:
    z-score-threshold: 3.0
    retraining-interval-hours: 24
    min-samples-for-detection: 30

  # AI layer master switches (FR-8: defaults are safe / advisory-only)
  agent:
    enabled: ${AGENT_ENABLED:false}
    mode: ${AGENT_MODE:advisory}
    max-steps: ${AGENT_MAX_STEPS:8}
    history-max-messages: ${AGENT_HISTORY_MAX:20}
    proactive-scan-interval-seconds: ${AGENT_PROACTIVE_SCAN_SECONDS:0}
    rca-on-correlation: ${AGENT_RCA_ON_CORRELATION:false}
    redaction:
      enabled: ${AGENT_REDACTION_ENABLED:true}

  # Model endpoint configuration (FR-1: env-driven, no code change to swap providers)
  aihub:
    provider: ${LLM_PROVIDER:anthropic}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    max-tokens: ${LLM_MAX_TOKENS:2000}
    timeout-ms: ${LLM_TIMEOUT_MS:30000}
    anthropic-version: ${LLM_ANTHROPIC_VERSION:2023-06-01}

  # Knowledge base / RAG configuration (FR-4)
  knowledge:
    embedding-model: ${KNOWLEDGE_EMBEDDING_MODEL:}
    embedding-base-url: ${KNOWLEDGE_EMBEDDING_BASE_URL:}
    embedding-api-key: ${KNOWLEDGE_EMBEDDING_API_KEY:}
    embedding-dimension: ${KNOWLEDGE_EMBEDDING_DIMENSION:1024}
    top-k: ${KNOWLEDGE_TOP_K:5}
    # set true once pgvector extension is provisioned (FR-4); falls back to in-memory cosine otherwise
    pgvector-enabled: ${KNOWLEDGE_PGVECTOR_ENABLED:false}

  # Read-only target DB connections for query_database tool (FR-5)
  db-targets:
    targets: []
    # Example (configure via env in deployments):
    # - name: payments-readonly
    #   url: jdbc:postgresql://payments-replica:5432/payments
    #   username: ${PAYMENTS_RO_USER:}
    #   password: ${PAYMENTS_RO_PASSWORD:}

  # Runtime / APM metrics source for get_runtime_metrics tool (FR-5)
  apm:
    url: ${APM_URL:}
    api-key: ${APM_API_KEY:}
    actuator-targets: []
