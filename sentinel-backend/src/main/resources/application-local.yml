
spring:
  application:
    name: sentinel

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/sentinel}
    username: ${DATABASE_USER:sentinel}
    password: ${DATABASE_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: sentinel-correlation
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.sentinel.model
        spring.json.value.default.type: com.sentinel.model.NormalizedEvent
      auto-offset-reset: latest

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # `env` exposed in local profile so we can debug which property source
        # is winning when AGENT_ENABLED, etc. behave unexpectedly. NEVER expose
        # `env` in production — it leaks every config value including secrets.
        include: health,info,metrics,prometheus,env,configprops,beans
  endpoint:
    health:
      show-details: always

# === LOCAL-PROFILE LOGGING ===
# Surface every step of the ingest -> correlate -> incident -> ws-push pipeline
# at INFO. With this on, the IntelliJ console becomes a live trace and any
# break in the chain (ES poll empty, no service registered, no rule firing,
# WS not pushing) shows up as a missing log line.
logging:
  level:
    com.sentinel: INFO
    com.sentinel.ingestion: INFO
    com.sentinel.correlation: INFO
    com.sentinel.normalization: INFO
    com.sentinel.api.WebSocketEventController: INFO
    com.sentinel.scheduler: INFO
    org.springframework.kafka: WARN
    io.fabric8: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# SENTINEL platform configuration
sentinel:
  elasticsearch:
    url: ${ES_URL:http://localhost:9201}
    index-pattern: "logs-*"
    poll-interval-seconds: 30
    username: ${ES_USER:}
    password: ${ES_PASSWORD:}

  jaeger:
    url: ${JAEGER_URL:http://localhost:16687}
    slow-trace-threshold-ms: 2000
    poll-interval-seconds: 60

  grafana:
    url: ${GRAFANA_URL:http://localhost:3001}
    api-key: ${GRAFANA_API_KEY:}
    poll-interval-seconds: 15

  # Active health probes — every 10s SENTINEL hits the `url` on each target.
  # A timeout / connection-refused / non-200 emits a PROBE event with
  # severity P1_CRITICAL, which ServiceDownRule turns into an incident.
  # That's how "all pods of service X went down" becomes a P1 card on
  # the dashboard within ~10 seconds — no need to wait for the next
  # ingestion poll.
  #
  # Add a row per local service you want monitored. Remove a target to
  # stop probing it.
  health-probe:
    interval-seconds: 10
    timeout-seconds: 5
    targets:
      # Spring Boot sample-app on host port 1881 (mvn spring-boot:run)
      - name: my-spring-boot-app
        url: http://localhost:1881/actuator/health
        type: HTTP
      # Python sample-producer self-exposes /metrics on 1882; the producer
      # has no /health endpoint, but a successful /metrics fetch proves
      # the process is alive.
      - name: sample-producer
        url: http://localhost:1882/metrics
        type: HTTP
      # SENTINEL backend self-check (catches its own deadlocks)
      - name: sentinel-backend
        url: http://localhost:8080/actuator/health
        type: HTTP

  correlation:
    window-minutes: 5
    min-signals-for-correlation: 2

  alerting:
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      channel: "#sentinel-alerts"
    pagerduty:
      integration-key: ${PAGERDUTY_KEY:}
      events-url: https://events.pagerduty.com/v2/enqueue
    opsgenie:
      api-key: ${OPSGENIE_KEY:}
      alerts-url: https://api.opsgenie.com/v2/alerts
    teams:
      default-webhook-url: ${TEAMS_WEBHOOK_URL:}
      kibana-base-url: ${KIBANA_URL:http://localhost:5602}
      grafana-base-url: ${GRAFANA_URL:http://localhost:3001}
      jaeger-base-url: ${JAEGER_URL:http://localhost:16687}

  # === LOCAL HARD SAFETY ===
  # No K8s mutations from a laptop run, ever. The env-var override is
  # intentionally NOT honored here so a stray REMEDIATION_DRY_RUN=false
  # can't accidentally take real action against a cluster.
  remediation:
    dry-run: true
    max-scale-factor: 2.0
    restart-cooldown-minutes: 20
    max-restarts-per-hour: 3
    circuit-breaker-retry-minutes: 5
    max-circuit-breaker-cycles: 3

  anomaly:
    z-score-threshold: 3.0
    retraining-interval-hours: 24
    min-samples-for-detection: 30

  # AI Copilot — HARDCODED ON in the local profile.
  # No ${VAR:default} placeholders: an `AGENT_ENABLED=false` env var lingering
  # in someone's IntelliJ run config or Windows shell was overriding the
  # placeholder and silently keeping the agent off. Hardcoding means
  # "local profile = agent on, period." If you genuinely want to disable
  # the agent, comment these lines OR remove the local profile.
  agent:
    enabled: true
    mode: advisory
    max-steps: 8
    history-max-messages: 20
    proactive-scan-interval-seconds: 0
    rca-on-correlation: true
    redaction:
      enabled: true

  # LLM provider — HARDCODED to local Ollama.
  # ────────────────────────────────────────────────────────────────────────
  # Model selection guide — picked for AGENTIC TOOL USE, not coding:
  #
  #   llama3.1:8b           ★ recommended for laptops — strong tool calling,
  #                           ~4.7GB, runs on 8GB+ RAM
  #   qwen2.5:14b-instruct  ★ best Ollama option for tool use,
  #                           ~8.4GB, needs 16GB+ RAM
  #   llama3.2:3b           lightweight fallback if RAM is tight, ~2GB
  #
  # AVOID for the agent:
  #   qwen2.5-coder:*       trained for code completion, refuses tool calls
  #   deepseek-coder:*      same problem — code model, not agent model
  #
  # To switch model at runtime without editing this file, use the model
  # dropdown in the AI Copilot tab, or POST /api/agent/model { "model": "..." }
  #
  # To switch to Anthropic for production-grade quality, set:
  #   LLM_PROVIDER=anthropic
  #   LLM_BASE_URL=https://api.anthropic.com
  #   LLM_API_KEY=sk-ant-...
  #   LLM_MODEL=claude-haiku-4-5-20251001
  aihub:
    provider: ollama
    base-url: http://localhost:11434
    api-key: ""
    model: llama3.1:8b
    max-tokens: 2000
    # 7B model on a laptop is slow: a single warm inference here is ~55s and the
    # cold first call (loads ~4.7GB into memory) exceeds 60s. Each agent step is
    # one inference, so give a generous per-call ceiling to avoid spurious timeouts.
    timeout-ms: 120000
    anthropic-version: "2023-06-01"

  knowledge:
    embedding-model: ${KNOWLEDGE_EMBEDDING_MODEL:}
    embedding-base-url: ${KNOWLEDGE_EMBEDDING_BASE_URL:}
    embedding-api-key: ${KNOWLEDGE_EMBEDDING_API_KEY:}
    embedding-dimension: ${KNOWLEDGE_EMBEDDING_DIMENSION:1024}
    top-k: ${KNOWLEDGE_TOP_K:5}
    pgvector-enabled: ${KNOWLEDGE_PGVECTOR_ENABLED:false}

  # Read-only DB targets the agent's query_database tool can hit.
  # `sentinel` is SENTINEL's OWN database — exposing it lets the agent answer
  # questions like "how many incidents fired in the last hour?" directly via
  # SQL on the incidents table, instead of trying to aggregate via search_logs
  # (which weaker models hallucinate the schema for).
  db-targets:
    targets:
      - name: sentinel
        url: jdbc:postgresql://localhost:5433/sentinel
        username: sentinel
        password: sentinel
        driverClassName: org.postgresql.Driver
        queryRowLimit: 200
        queryTimeoutSeconds: 5

  apm:
    url: ${APM_URL:}
    api-key: ${APM_API_KEY:}
    actuator-targets: []

  # === LOCAL: Daily digest OFF ===
  # Don't email yourself every morning while testing — flip via env when needed.
  digest:
    daily:
      enabled: ${DIGEST_DAILY_ENABLED:false}
      cron: ${DIGEST_DAILY_CRON:0 0 9 * * *}
      lookback-hours: ${DIGEST_LOOKBACK_HOURS:24}
      use-ai: ${DIGEST_USE_AI:true}
      slack: ${DIGEST_SLACK:true}
      email-recipients: ${DIGEST_EMAIL_RECIPIENTS:}
      max-incidents-in-prompt: 50

  # === LOCAL: First-class Kafka/AMQ ingestion OFF ===
  # The local stack doesn't usually run Kafka or AMQ for the SAMPLE APP
  # to push to — your sample-app emits logs/traces/metrics, not Kafka
  # messages. Enable + populate consumer-groups / queues when you
  # actually have a target broker to watch.
  kafka:
    enabled: ${KAFKA_INGEST_ENABLED:false}
    bootstrap-servers: ${KAFKA_INGEST_BOOTSTRAP:localhost:9093}
    poll-interval-seconds: 30
    admin-timeout-ms: 5000
    consumer-groups: {}
    topics: []

  activemq:
    enabled: ${AMQ_INGEST_ENABLED:false}
    jolokia-url: ${AMQ_JOLOKIA_URL:http://localhost:8161/api/jolokia}
    username: ${AMQ_USER:admin}
    password: ${AMQ_PASSWORD:admin}
    broker-name: ${AMQ_BROKER_NAME:localhost}
    poll-interval-seconds: 30
    queues: {}
